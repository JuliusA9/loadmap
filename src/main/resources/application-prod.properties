# Production settings. Turned on by setting the environment variable SPRING_PROFILES_ACTIVE=prod.
# Anything not listed here comes from application.properties.

# ---------- Database: PostgreSQL ----------
# The host gives you these values; set them as environment variables, never commit them.
# DB_URL looks like: jdbc:postgresql://<host>:5432/<database>
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Create/update tables from the @Entity classes, same as in development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Web server ----------
# Hosting services tell the app which port to use through $PORT
server.port=${PORT:8080}
# The host handles HTTPS in front of the app; trust its headers so Spring knows the request was secure
server.forward-headers-strategy=framework
# Only send the login cookie over HTTPS, and never let page scripts read it
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
