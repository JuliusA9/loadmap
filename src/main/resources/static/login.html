<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In · LoadMap</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --secondary: #6e6e73;
      --separator: rgba(0, 0, 0, 0.08);
      --group: #ffffff;
      --field: #f5f5f7;
      --gray: #d2d2d7;
      --green: #34c759;
      --orange: #ff9500;
      --red: #ff3b30;
      --blue: #0071e3;
      --seg-bg: rgba(118, 118, 128, 0.12);
      --seg-active: #ffffff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 40px rgba(0, 0, 0, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1c1c1e;
        --text: #f5f5f7;
        --secondary: #98989d;
        --separator: rgba(255, 255, 255, 0.1);
        --field: #2c2c2e;
        --gray: #3a3a3c;
        --green: #30d158;
        --orange: #ff9f0a;
        --red: #ff453a;
        --blue: #0a84ff;
        --seg-bg: rgba(118, 118, 128, 0.24);
        --seg-active: #636366;
        --shadow: none;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }

    .wrap { width: 100%; max-width: 380px; text-align: center; animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    .mark {
      width: 64px; height: 64px; margin: 0 auto 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--green), var(--orange) 55%, var(--red));
      box-shadow: 0 10px 30px rgba(255, 59, 48, 0.25);
    }
    h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
    .tagline { color: var(--secondary); font-size: 17px; margin: 6px 0 32px; }

    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 24px;
      text-align: left;
    }
    .card.shake { animation: shake 0.4s; }
    @keyframes shake {
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .segmented { display: flex; background: var(--seg-bg); border-radius: 9px; padding: 2px; margin-bottom: 20px; }
    .segmented button {
      flex: 1; border: none; background: transparent; color: var(--text);
      padding: 7px 4px; font-size: 13px; font-weight: 500;
      border-radius: 7px; cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .segmented button.active {
      background: var(--seg-active); font-weight: 600;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 3px 1px rgba(0, 0, 0, 0.04);
    }

    .group { background: var(--field); border-radius: 12px; overflow: hidden; }
    .group input {
      display: block; width: 100%;
      background: transparent; border: none; outline: none;
      color: var(--text); font-size: 17px;
      padding: 14px 16px;
    }
    .group input + input { border-top: 1px solid var(--separator); }
    .group:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 35%, transparent); }

    .hint { font-size: 13px; color: var(--secondary); margin: 10px 4px 0; }
    .error { font-size: 14px; color: var(--red); margin: 12px 4px 0; min-height: 20px; }

    .primary {
      width: 100%; margin-top: 16px;
      background: var(--blue); color: #fff;
      border: none; border-radius: 12px;
      padding: 14px; font-size: 17px; font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s, opacity 0.15s;
    }
    .primary:hover { filter: brightness(1.08); }
    .primary:active { transform: scale(0.98); }
    .primary:disabled { opacity: 0.5; cursor: default; transform: none; filter: none; }

    .footnote { color: var(--secondary); font-size: 13px; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark" aria-hidden="true"></div>
    <h1>LoadMap</h1>
    <p class="tagline">See your crunch weeks before they hit.</p>

    <form class="card" id="form" novalidate>
      <div class="segmented" role="tablist">
        <button type="button" data-mode="login" class="active" role="tab">Sign In</button>
        <button type="button" data-mode="signup" role="tab">Create Account</button>
      </div>

      <div class="group">
        <input id="email" type="email" placeholder="Email" autocomplete="email" required autofocus>
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      </div>

      <p class="hint" id="hint" hidden>Use at least 8 characters.</p>
      <p class="error" id="error" role="alert"></p>

      <button type="submit" class="primary" id="submit">Sign In</button>
    </form>

    <p class="footnote">Your planner is private to your account.</p>
  </div>

  <script>
    let mode = "login";

    const form = document.getElementById("form");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const hint = document.getElementById("hint");
    const error = document.getElementById("error");
    const submit = document.getElementById("submit");

    // Already logged in? Skip straight to the dashboard
    fetch("/api/auth/me").then(res => { if (res.ok) window.location.replace("/"); });

    function setMode(newMode) {
      mode = newMode;
      document.querySelectorAll(".segmented button").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
      submit.textContent = mode === "login" ? "Sign In" : "Create Account";
      password.setAttribute("autocomplete", mode === "login" ? "current-password" : "new-password");
      hint.hidden = mode === "login";
      error.textContent = "";
    }

    function showError(message) {
      error.textContent = message;
      form.classList.remove("shake");
      void form.offsetWidth;  // restart the animation
      form.classList.add("shake");
    }

    async function handleSubmit(event) {
      event.preventDefault();
      error.textContent = "";

      if (!email.value.includes("@")) return showError("Enter a valid email.");
      if (mode === "signup" && password.value.length < 8) return showError("Password must be at least 8 characters.");
      if (password.value === "") return showError("Enter your password.");

      submit.disabled = true;
      const label = submit.textContent;
      submit.textContent = mode === "login" ? "Signing In…" : "Creating Account…";

      try {
        const res = await fetch(`/api/auth/${mode}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email.value.trim(), password: password.value })
        });
        if (res.ok) {
          window.location.href = "/";
          return;
        }
        const data = await res.json().catch(() => ({}));
        showError(data.error || "Something went wrong. Try again.");
      } catch {
        showError("Can't reach the server. Is it running?");
      }
      submit.disabled = false;
      submit.textContent = label;
    }

    document.querySelectorAll(".segmented button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
    form.addEventListener("submit", handleSubmit);
  </script>
</body>
</html>
