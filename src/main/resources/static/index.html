<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoadMap</title>
  <style>
    /* ---------- Design tokens (Apple-style system colors) ---------- */
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --secondary: #6e6e73;
      --separator: rgba(0, 0, 0, 0.08);
      --nav: rgba(245, 245, 247, 0.72);
      --gray: #d2d2d7;
      --green: #34c759;
      --orange: #ff9500;
      --red: #ff3b30;
      --blue: #0071e3;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 28px rgba(0, 0, 0, 0.06);
      --sheet-bg: #f2f2f7;
      --group: #ffffff;
      --seg-bg: rgba(118, 118, 128, 0.12);
      --seg-active: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1c1c1e;
        --text: #f5f5f7;
        --secondary: #98989d;
        --separator: rgba(255, 255, 255, 0.1);
        --nav: rgba(22, 22, 23, 0.72);
        --gray: #3a3a3c;
        --green: #30d158;
        --orange: #ff9f0a;
        --red: #ff453a;
        --blue: #0a84ff;
        --shadow: none;
        --sheet-bg: #1c1c1e;
        --group: #2c2c2e;
        --seg-bg: rgba(118, 118, 128, 0.24);
        --seg-active: #636366;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }

    /* ---------- Frosted-glass navigation bar ---------- */
    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 28px;
      background: var(--nav);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--separator);
    }
    .brand { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
    .brand-mark {
      width: 22px; height: 22px; border-radius: 6px;
      background: linear-gradient(135deg, var(--green), var(--orange) 55%, var(--red));
    }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .term { color: var(--secondary); font-size: 14px; }
    .add-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--blue); color: #fff;
      border: none; border-radius: 999px;
      padding: 7px 14px 7px 11px;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
    }
    .add-btn:hover { filter: brightness(1.08); }
    .add-btn:active { transform: scale(0.96); }

    main { max-width: 1040px; margin: 0 auto; padding: 40px 24px 64px; }

    .page-title { font-size: 44px; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
    .page-subtitle { color: var(--secondary); font-size: 19px; margin: 6px 0 32px; }

    .card {
      background: var(--card);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 24px;
    }
    .card-title { font-size: 21px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; }
    .card-caption { color: var(--secondary); font-size: 14px; margin: 0 0 20px; }

    /* ---------- Summary stats ---------- */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 16px; }
    .stat-label { color: var(--secondary); font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-value { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; margin-top: 8px; display: flex; align-items: center; gap: 10px; }
    .stat-sub { color: var(--secondary); font-size: 14px; margin-top: 4px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

    /* ---------- Screen Time-style bar chart ---------- */
    .chart { display: flex; gap: 8px; align-items: flex-end; height: 220px; }
    .col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      color: inherit;
      border-radius: 10px;
    }
    .col:focus { outline: none; }
    .col:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
    .bar-track { flex: 1; width: 100%; display: flex; align-items: flex-end; }
    .bar {
      width: 100%;
      height: 0;
      border-radius: 8px;
      transition: height 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s, transform 0.2s;
      opacity: 0.45;
    }
    .col:hover .bar { opacity: 0.75; }
    .col.selected .bar { opacity: 1; transform: scaleX(1.06); }
    .col-month { font-size: 11px; font-weight: 600; color: var(--secondary); height: 14px; margin-top: 10px; }
    .col-day { font-size: 12px; color: var(--secondary); }
    .col.selected .col-day { color: var(--text); font-weight: 600; }
    .today-dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 4px; background: transparent; }
    .col.current .today-dot { background: var(--blue); }

    /* ---------- Two-column lower section ---------- */
      .lower { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; margin-top: 16px; align-items: start; }

    .week-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 999px;
      font-size: 13px; font-weight: 600; white-space: nowrap;
    }

    .row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--separator); }
    .row:first-child { border-top: none; }
    .row-main { flex: 1; min-width: 0; }
    .row-title { font-size: 16px; font-weight: 500; }
    .row-sub { font-size: 13px; color: var(--secondary); margin-top: 2px; }
    .row-right { text-align: right; font-size: 13px; color: var(--secondary); white-space: nowrap; }
    .row-right strong { display: block; color: var(--text); font-weight: 500; font-size: 14px; }

    .delete-btn {
      width: 28px; height: 28px; flex-shrink: 0;
      border: none; border-radius: 50%;
      background: var(--seg-bg); color: var(--secondary);
      font-size: 16px; line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s, color 0.15s;
    }
    .row:hover .delete-btn, .delete-btn:focus-visible { opacity: 1; }
    .delete-btn:hover { background: color-mix(in srgb, var(--red) 18%, transparent); color: var(--red); }
    @media (hover: none) { .delete-btn { opacity: 1; } }

    /* Calendar-app style date badge */
    .date-badge {
      width: 46px; flex-shrink: 0; text-align: center;
      border-radius: 10px; overflow: hidden;
      background: var(--bg);
    }
    .date-badge .m { background: var(--red); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; padding: 3px 0; }
    .date-badge .d { font-size: 20px; font-weight: 600; padding: 4px 0 5px; }

    .countdown { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--bg); color: var(--secondary); white-space: nowrap; }
    .countdown.soon { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); }

    .empty { color: var(--secondary); padding: 28px 0 12px; text-align: center; font-size: 15px; }
    .error { text-align: center; color: var(--secondary); padding: 80px 0; font-size: 17px; }

    .fade { animation: fade 0.5s ease both; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* ---------- iOS-style bottom sheet ---------- */
    .backdrop {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .sheet {
      position: fixed; z-index: 21;
      left: 50%; bottom: 0;
      width: min(540px, 100%);
      max-height: 92vh; overflow-y: auto;
      background: var(--sheet-bg);
      border-radius: 24px 24px 0 0;
      padding: 8px 20px 32px;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.2);
      transform: translate(-50%, 105%);
      transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
    }
    body.sheet-open .backdrop { opacity: 1; pointer-events: auto; }
    body.sheet-open .sheet { transform: translate(-50%, 0); }
    @media (min-width: 761px) {
      .sheet { bottom: 32px; border-radius: 24px; transform: translate(-50%, calc(100% + 48px)); }
    }

    .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--gray); margin: 0 auto 12px; }
    .sheet-header {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      margin-bottom: 20px;
    }
    .sheet-header h2 { margin: 0; font-size: 17px; font-weight: 600; }
    .text-btn { background: none; border: none; color: var(--blue); font-size: 17px; cursor: pointer; padding: 6px 0; }
    .text-btn.left { justify-self: start; }
    .text-btn.right { justify-self: end; font-weight: 600; }
    .text-btn:disabled { color: var(--gray); cursor: default; }

    .section-label { font-size: 13px; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 6px 16px; }
    .group { background: var(--group); border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
    .field { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 16px 0 0; margin-left: 16px; border-top: 1px solid var(--separator); }
    .field:first-child { border-top: none; }
    .field label { font-size: 16px; flex-shrink: 0; }
    .field input, .field select {
      flex: 1; min-width: 0;
      background: transparent; border: none; outline: none;
      font: inherit; font-size: 16px; color: var(--secondary);
      text-align: right; text-align-last: right;
      padding: 12px 0;
    }
    .field input.full { text-align: left; color: var(--text); }
    .field select { appearance: none; -webkit-appearance: none; cursor: pointer; }
    .field .suffix { color: var(--secondary); font-size: 16px; }

    .segmented { display: flex; background: var(--seg-bg); border-radius: 9px; padding: 2px; margin-bottom: 24px; }
    .segmented button {
      flex: 1; border: none; background: transparent; color: var(--text);
      padding: 7px 2px; font-size: 13px; font-weight: 500;
      border-radius: 7px; cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .segmented button.active {
      background: var(--seg-active); font-weight: 600;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 3px 1px rgba(0, 0, 0, 0.04);
    }

    /* ---------- Toast notification ---------- */
    .toast {
      position: fixed; z-index: 30; top: 72px; left: 50%;
      transform: translate(-50%, -20px);
      background: var(--nav);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: 1px solid var(--separator);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      padding: 10px 18px; border-radius: 999px;
      font-size: 14px; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s, transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 760px) {
      nav { padding: 12px 16px; }
      .term { display: none; }
      .page-title { font-size: 34px; }
      .stats, .lower { grid-template-columns: 1fr; }
      .chart { gap: 4px; height: 180px; }
      .col-month { font-size: 9px; }
      .col-day { font-size: 10px; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="brand"><div class="brand-mark"></div>LoadMap</div>
    <div class="nav-right">
      <div class="term">Fall 2026</div>
      <button class="add-btn" id="open-sheet" aria-label="Add assignment">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
          <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Add
      </button>
    </div>
  </nav>

  <main id="app">
    <h1 class="page-title fade">Workload</h1>
    <p class="page-subtitle fade">See your crunch weeks before they hit.</p>

    <section class="stats fade" id="stats"></section>

    <section class="card fade">
      <h2 class="card-title">Semester Overview</h2>
      <p class="card-caption">Each bar is one week. Taller and redder means busier. Tap a week for details.</p>
      <div class="chart" id="chart"></div>
    </section>

    <section class="lower fade">
      <div class="card" id="week-detail"></div>
      <div class="card">
        <h2 class="card-title">Up Next</h2>
        <p class="card-caption">Your next deadlines</p>
        <div id="upcoming"></div>
      </div>
    </section>
  </main>

  <!-- Add assignment sheet -->
  <div class="backdrop" id="backdrop"></div>
  <form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" autocomplete="off">
    <div class="grabber"></div>
    <div class="sheet-header">
      <button type="button" class="text-btn left" id="cancel-sheet">Cancel</button>
      <h2 id="sheet-title">New Assignment</h2>
      <button type="submit" class="text-btn right" id="submit-sheet" disabled>Add</button>
    </div>

    <div class="group">
      <div class="field">
        <input class="full" id="f-title" type="text" placeholder="Title" maxlength="80">
      </div>
      <div class="field">
        <label for="f-course">Course</label>
        <select id="f-course"></select>
      </div>
    </div>

    <p class="section-label">Type</p>
    <div class="segmented" id="f-type">
      <button type="button" data-type="EXAM">Exam</button>
      <button type="button" data-type="QUIZ">Quiz</button>
      <button type="button" data-type="HOMEWORK" class="active">Homework</button>
      <button type="button" data-type="PROJECT">Project</button>
      <button type="button" data-type="DISCUSSION">Discussion</button>
    </div>

    <p class="section-label">Details</p>
    <div class="group">
      <div class="field">
        <label for="f-date">Due</label>
        <input id="f-date" type="date">
      </div>
      <div class="field">
        <label for="f-points">Points</label>
        <input id="f-points" type="number" min="0" step="1" placeholder="100" inputmode="numeric">
      </div>
      <div class="field">
        <label for="f-weight">Share of Grade</label>
        <input id="f-weight" type="number" min="0" max="100" step="0.1" placeholder="10" inputmode="decimal">
        <span class="suffix">%</span>
      </div>
    </div>
  </form>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const SEMESTER_START = new Date(2026, 7, 24);   // Aug 24 (months start at 0)
    const SEMESTER_END   = new Date(2026, 11, 14);  // Dec 14

    const LEVEL_COLOR = { FREE: "var(--gray)", LIGHT: "var(--green)", MODERATE: "var(--orange)", HEAVY: "var(--red)" };
    const COURSE_PALETTE = ["#0a84ff", "#bf5af2", "#ff9f0a", "#30d158", "#ff375f", "#64d2ff"];

    let weeks = [];
    let assignments = [];
    let courses = [];
    let courseColor = {};
    let selectedType = "HOMEWORK";

    // ---------- Small helpers ----------
    function parseDate(str) {               // "2026-10-19" -> local Date
      const [y, m, d] = str.split("-").map(Number);
      return new Date(y, m - 1, d);
    }
    function toKey(date) {                  // Date -> "2026-10-19"
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${date.getFullYear()}-${m}-${d}`;
    }
    function mondayOf(date) {
      const d = new Date(date);
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      d.setHours(0, 0, 0, 0);
      return d;
    }
    function today() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      return d;
    }
    function daysUntil(date) {
      return Math.round((date - today()) / 86400000);
    }
    function fmt(date, options = { month: "short", day: "numeric" }) {
      return date.toLocaleDateString("en-US", options);
    }
    function titleCase(word) {
      return word.charAt(0) + word.slice(1).toLowerCase();
    }
    function el(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function countdownText(n) {
      if (n === 0) return "Today";
      if (n === 1) return "Tomorrow";
      return `in ${n} days`;
    }
    function assignmentsInWeek(week) {
      return assignments
        .filter(a => toKey(mondayOf(parseDate(a.dueDate))) === week.key)
        .sort((a, b) => a.dueDate.localeCompare(b.dueDate));
    }

    let toastTimer;
    function toast(message) {
      const t = document.getElementById("toast");
      t.textContent = message;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
    }

    // ---------- Data ----------
    async function loadData() {
      const [workloadRes, assignmentsRes, coursesRes] = await Promise.all([
        fetch("/api/workload"),
        fetch("/api/assignments"),
        fetch("/api/courses")
      ]);
      if (!workloadRes.ok || !assignmentsRes.ok || !coursesRes.ok) throw new Error("API error");

      const workload = await workloadRes.json();
      assignments = await assignmentsRes.json();
      courses = await coursesRes.json();

      const byWeek = {};
      workload.forEach(w => byWeek[w.weekOf] = w);

      weeks = [];
      for (let d = new Date(SEMESTER_START); d <= SEMESTER_END; d.setDate(d.getDate() + 7)) {
        const date = new Date(d);
        const key = toKey(date);
        const data = byWeek[key] || { score: 0, level: "FREE" };
        weeks.push({ date, key, score: data.score, level: data.level });
      }

      courseColor = {};
      [...courses].sort((a, b) => a.code.localeCompare(b.code))
        .forEach((c, i) => courseColor[c.code] = COURSE_PALETTE[i % COURSE_PALETTE.length]);
    }

    function renderAll(selectKey) {
      document.getElementById("stats").innerHTML = "";
      document.getElementById("chart").innerHTML = "";
      document.getElementById("upcoming").innerHTML = "";

      renderStats();
      renderChart();
      renderUpcoming();

      const target = weeks.find(w => w.key === selectKey)
        || weeks.find(w => w.key === toKey(mondayOf(today())))
        || weeks.find(w => w.score > 0)
        || weeks[0];
      selectWeek(target);
    }

    // ---------- Summary stats ----------
    function renderStats() {
      const stats = document.getElementById("stats");
      const thisMonday = mondayOf(today());
      const thisWeek = weeks.find(w => w.key === toKey(thisMonday));
      const nextHeavy = weeks.find(w => w.level === "HEAVY" && w.date >= thisMonday);
      const dueSoon = assignments.filter(a => {
        const n = daysUntil(parseDate(a.dueDate));
        return n >= 0 && n <= 14;
      }).length;

      const cards = [
        {
          label: "This Week",
          value: thisWeek ? titleCase(thisWeek.level) : "—",
          color: thisWeek ? LEVEL_COLOR[thisWeek.level] : null,
          sub: thisWeek ? `Load score ${thisWeek.score}` : "Outside the semester"
        },
        {
          label: "Next Crunch",
          value: nextHeavy ? fmt(nextHeavy.date) : "None",
          color: nextHeavy ? LEVEL_COLOR.HEAVY : LEVEL_COLOR.LIGHT,
          sub: !nextHeavy ? "No heavy weeks ahead"
             : nextHeavy.key === toKey(thisMonday) ? "That's this week"
             : `Starts in ${daysUntil(nextHeavy.date)} days`
        },
        {
          label: "Due Soon",
          value: String(dueSoon),
          color: null,
          sub: "Deadlines in the next 14 days"
        }
      ];

      cards.forEach(c => {
        const card = el("div", "card");
        card.appendChild(el("div", "stat-label", c.label));
        const value = el("div", "stat-value");
        if (c.color) {
          const dot = el("span", "dot");
          dot.style.background = c.color;
          value.appendChild(dot);
        }
        value.appendChild(document.createTextNode(c.value));
        card.appendChild(value);
        card.appendChild(el("div", "stat-sub", c.sub));
        stats.appendChild(card);
      });
    }

    // ---------- Bar chart ----------
    function renderChart() {
      const chart = document.getElementById("chart");
      const maxScore = Math.max(8, ...weeks.map(w => w.score));
      const currentKey = toKey(mondayOf(today()));
      let lastMonth = -1;

      weeks.forEach(week => {
        const col = el("button", "col");
        col.dataset.key = week.key;
        if (week.key === currentKey) col.classList.add("current");
        col.setAttribute("aria-label", `Week of ${fmt(week.date)}, ${week.level}, score ${week.score}`);

        const track = el("div", "bar-track");
        const bar = el("div", "bar");
        bar.style.background = LEVEL_COLOR[week.level];
        track.appendChild(bar);
        col.appendChild(track);

        const month = week.date.getMonth();
        col.appendChild(el("div", "col-month", month !== lastMonth ? fmt(week.date, { month: "short" }) : ""));
        lastMonth = month;
        col.appendChild(el("div", "col-day", String(week.date.getDate())));
        col.appendChild(el("div", "today-dot"));

        col.addEventListener("click", () => selectWeek(week));
        chart.appendChild(col);

        const height = week.score === 0 ? 4 : Math.max(10, (week.score / maxScore) * 100);
        requestAnimationFrame(() => setTimeout(() => bar.style.height = `${height}%`, 60));
      });
    }

    // ---------- Selected week detail ----------
    function selectWeek(week) {
      document.querySelectorAll(".col").forEach(c => c.classList.toggle("selected", c.dataset.key === week.key));

      const panel = document.getElementById("week-detail");
      panel.innerHTML = "";

      const end = new Date(week.date);
      end.setDate(end.getDate() + 6);

      const header = el("div", "week-header");
      const titles = el("div");
      titles.appendChild(el("h2", "card-title", `Week of ${fmt(week.date)}`));
      titles.appendChild(el("p", "card-caption", `${fmt(week.date, { weekday: "short", month: "short", day: "numeric" })} – ${fmt(end, { weekday: "short", month: "short", day: "numeric" })}`));
      header.appendChild(titles);

      const pill = el("span", "pill", `${titleCase(week.level)} · ${week.score}`);
      pill.style.background = `color-mix(in srgb, ${LEVEL_COLOR[week.level]} 18%, transparent)`;
      pill.style.color = week.level === "FREE" ? "var(--secondary)" : LEVEL_COLOR[week.level];
      header.appendChild(pill);
      panel.appendChild(header);

      const items = assignmentsInWeek(week);
      if (items.length === 0) {
        panel.appendChild(el("div", "empty", "Nothing due. A good week to get ahead."));
        return;
      }

      const list = el("div");
      items.forEach(a => {
        const due = parseDate(a.dueDate);
        const row = el("div", "row");

        const dot = el("span", "dot");
        dot.style.background = courseColor[a.course.code] || "var(--gray)";
        row.appendChild(dot);

        const main = el("div", "row-main");
        main.appendChild(el("div", "row-title", a.title));
        main.appendChild(el("div", "row-sub", `${a.course.code} · ${titleCase(a.type)}`));
        row.appendChild(main);

        const right = el("div", "row-right");
        right.appendChild(el("strong", "", fmt(due, { weekday: "short", month: "short", day: "numeric" })));
        right.appendChild(document.createTextNode(`${+a.weightPercent.toFixed(1)}% of grade`));
        row.appendChild(right);

        const del = el("button", "delete-btn", "×");
        del.setAttribute("aria-label", `Delete ${a.title}`);
        del.addEventListener("click", () => deleteAssignment(a, week.key));
        row.appendChild(del);

        list.appendChild(row);
      });
      panel.appendChild(list);
    }

    // ---------- Upcoming deadlines ----------
    function renderUpcoming() {
      const box = document.getElementById("upcoming");
      const upcoming = assignments
        .filter(a => daysUntil(parseDate(a.dueDate)) >= 0)
        .sort((a, b) => a.dueDate.localeCompare(b.dueDate))
        .slice(0, 5);

      if (upcoming.length === 0) {
        box.appendChild(el("div", "empty", "You're all caught up."));
        return;
      }

      upcoming.forEach(a => {
        const due = parseDate(a.dueDate);
        const n = daysUntil(due);
        const row = el("div", "row");

        const badge = el("div", "date-badge");
        badge.appendChild(el("div", "m", fmt(due, { month: "short" }).toUpperCase()));
        badge.appendChild(el("div", "d", String(due.getDate())));
        row.appendChild(badge);

        const main = el("div", "row-main");
        main.appendChild(el("div", "row-title", a.title));
        main.appendChild(el("div", "row-sub", a.course.code));
        row.appendChild(main);

        row.appendChild(el("span", "countdown" + (n <= 7 ? " soon" : ""), countdownText(n)));
        box.appendChild(row);
      });
    }

    // ---------- Delete ----------
    async function deleteAssignment(a, weekKey) {
      try {
        const res = await fetch(`/api/assignments/${a.id}`, { method: "DELETE" });
        if (!res.ok) throw new Error();
        await loadData();
        renderAll(weekKey);
        toast(`Deleted “${a.title}”`);
      } catch {
        toast("Couldn't delete. Try again.");
      }
    }

    // ---------- Add assignment sheet ----------
    const sheet = document.getElementById("sheet");
    const fTitle = document.getElementById("f-title");
    const fCourse = document.getElementById("f-course");
    const fDate = document.getElementById("f-date");
    const fPoints = document.getElementById("f-points");
    const fWeight = document.getElementById("f-weight");
    const submitBtn = document.getElementById("submit-sheet");

    function setType(type) {
      selectedType = type;
      document.querySelectorAll("#f-type button").forEach(b => b.classList.toggle("active", b.dataset.type === type));
    }

    function openSheet() {
      fCourse.innerHTML = "";
      courses.forEach(c => {
        const opt = el("option", "", c.code);
        opt.value = c.id;
        fCourse.appendChild(opt);
      });
      sheet.reset();
      setType("HOMEWORK");
      fDate.value = toKey(today());
      validate();
      document.body.classList.add("sheet-open");
      setTimeout(() => fTitle.focus(), 350);
    }

    function closeSheet() {
      document.body.classList.remove("sheet-open");
    }

    function validate() {
      const weight = fWeight.value === "" ? 0 : Number(fWeight.value);
      const points = fPoints.value === "" ? 0 : Number(fPoints.value);
      const valid = fTitle.value.trim() !== ""
        && fCourse.value !== ""
        && fDate.value !== ""
        && points >= 0
        && weight >= 0 && weight <= 100;
      submitBtn.disabled = !valid;
    }

    async function submitAssignment(event) {
      event.preventDefault();
      if (submitBtn.disabled) return;
      submitBtn.disabled = true;

      const body = {
        title: fTitle.value.trim(),
        dueDate: fDate.value,
        points: fPoints.value === "" ? 0 : Number(fPoints.value),
        weightPercent: fWeight.value === "" ? 0 : Number(fWeight.value),
        type: selectedType
      };

      try {
        const res = await fetch(`/api/courses/${fCourse.value}/assignments`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error();
        closeSheet();
        await loadData();
        renderAll(toKey(mondayOf(parseDate(body.dueDate))));
        toast(`Added “${body.title}”`);
      } catch {
        toast("Couldn't save. Try again.");
        submitBtn.disabled = false;
      }
    }

    document.getElementById("open-sheet").addEventListener("click", openSheet);
    document.getElementById("cancel-sheet").addEventListener("click", closeSheet);
    document.getElementById("backdrop").addEventListener("click", closeSheet);
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
    document.querySelectorAll("#f-type button").forEach(b => b.addEventListener("click", () => setType(b.dataset.type)));
    sheet.addEventListener("input", validate);
    sheet.addEventListener("submit", submitAssignment);

    // ---------- Start ----------
    async function init() {
      try {
        await loadData();
        renderAll();
      } catch (err) {
        const app = document.getElementById("app");
        app.innerHTML = "";
        app.appendChild(el("div", "error", "Couldn't load your workload. Is the server running?"));
      }
    }

    init();
  </script>
</body>
</html>
